<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>g86</title>
    
    <!-- PWA Metadata -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10B981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="G86">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>

    <div class="container">
        <!-- PWA One-Click Install Banner -->
        <div id="pwaBanner" class="pwa-banner hidden">
            <div class="pwa-info">
                <img src="icon-192.png" alt="G86 Icon" class="pwa-logo">
                <div>
                    <strong>Instalează aplicația G86</strong>
                    <p>Salvează pe ecran direct din browser &bull; Fără Play Store</p>
                </div>
            </div>
            <button id="btnInstallPwa" class="btn btn-pwa btn-sm" onclick="installPwa()">Adaugă pe Ecran</button>
        </div>

        <!-- Header -->
        <header class="header">
            <h1>g86</h1>
        </header>

        <!-- Auth & Dashboard Container -->
        <main class="main-card">
            <!-- Auth Section (Shown when logged out) -->
            <div id="authSection" class="section-box">
                <div class="tabs">
                    <button id="tabLogin" class="tab-btn active" onclick="switchAuthTab('login')">Autentificare</button>
                    <button id="tabRegister" class="tab-btn" onclick="switchAuthTab('register')">Creare Cont</button>
                </div>

                <div id="authFeedback" class="feedback-msg hidden"></div>

                <!-- Login Form -->
                <form id="formLogin" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="loginIdentity">Email sau Nume Utilizator</label>
                        <input type="text" id="loginIdentity" placeholder="nume@exemplu.com" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Parola</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary" id="btnLogin">Intră în Cont</button>
                </form>

                <!-- Register Form -->
                <form id="formRegister" class="hidden" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="regEmail">Adresă de Email</label>
                        <input type="email" id="regEmail" placeholder="nume@exemplu.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Parolă (min. 8 caractere)</label>
                        <input type="password" id="regPassword" placeholder="••••••••" minlength="8" required autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="regPasswordConfirm">Confirmă Parola</label>
                        <input type="password" id="regPasswordConfirm" placeholder="••••••••" minlength="8" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary" id="btnRegister">Creează Contul</button>
                </form>
            </div>

            <!-- User Dashboard (Shown when logged in) -->
            <div id="dashboardSection" class="section-box hidden">
                <div class="user-bar">
                    <div class="user-info">
                        <div class="avatar" id="userAvatar">U</div>
                        <div>
                            <span class="user-greeting">Utilizator conectat:</span>
                            <strong id="userDisplayEmail">user@example.com</strong>
                        </div>
                    </div>
                    <button class="btn btn-secondary btn-sm" onclick="handleLogout()">Deconectare</button>
                </div>

                <!-- Public Chat P2P Accordion Card -->
                <div class="chat-card" id="chatAccordionCard">
                    <div class="chat-header" onclick="toggleChatDropdown()">
                        <div class="chat-title-group">
                            <div class="chat-icon-badge">💬</div>
                            <div class="chat-title-wrapper">
                                <h3>Public Chat</h3>
                            </div>
                        </div>
                        <div class="chat-header-right">
                            <div class="security-badge">
                                <span class="sec-dot"></span>
                                <span>Criptare end-2-end</span>
                            </div>
                            <span id="chatDropdownArrow" class="chat-arrow">▼</span>
                        </div>
                    </div>

                    <!-- Dropdown Body -->
                    <div id="chatDropdownBody" class="chat-dropdown-body">
                        <!-- Chat Messages Stream -->
                        <div class="chat-messages-container" id="chatContainer">
                            <div id="chatMessagesList" class="chat-messages-list">
                                <!-- Mesajele vor fi redate dinamic din memoria locală (IndexedDB) -->
                            </div>
                        </div>

                        <!-- Editing indicator bar (shown when editing a message) -->
                        <div id="chatEditingBar" class="chat-edit-bar hidden">
                            <span>✏️ Mod editare mesaj</span>
                            <button type="button" class="btn-cancel-edit" onclick="cancelEditingMessage()">✕ Anulează</button>
                        </div>

                        <!-- Selected File Preview Bar -->
                        <div id="filePreviewBar" class="file-preview-bar hidden">
                            <div class="preview-info">
                                <span id="previewFileIcon">📎</span>
                                <span id="previewFileName" class="preview-filename"></span>
                                <span id="previewFileSize" class="preview-filesize"></span>
                            </div>
                            <button type="button" class="btn-cancel-file" onclick="clearSelectedFile()" title="Șterge atașamentul">✕</button>
                        </div>

                        <!-- Scope Selector Bar (Public vs Private) -->
                        <div class="chat-scope-bar">
                            <span>Destinație:</span>
                            <div class="scope-btn-group">
                                <button type="button" id="btnScopePublic" class="btn-scope-pill active" onclick="setChatScope('public')">🌐 Public</button>
                                <button type="button" id="btnScopePrivate" class="btn-scope-pill" onclick="setChatScope('private')">🔒 Privat</button>
                            </div>
                            <input type="text" id="inputRecipient" class="chat-recipient-input hidden" placeholder="Email / Utilizator destinatar..." autocomplete="off">
                        </div>

                        <!-- Chat Input Form -->
                        <form id="formChat" class="chat-input-box" onsubmit="handleSendMessage(event)">
                            <input type="file" id="chatFileInput" class="hidden-file-input" onchange="handleFileSelected(event)" accept="image/*,video/*,audio/*,application/pdf,text/*,.doc,.docx,.zip">
                            <button type="button" class="btn-chat-sq btn-attach" onclick="triggerFileInput()" title="Atașează poză, video sau document">
                                <svg viewBox="0 0 24 24" class="paperclip-svg-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                                </svg>
                            </button>
                            <textarea id="inputChatMessage" rows="1" placeholder="Scrie un mesaj..." autocomplete="off"></textarea>
                            <button type="submit" class="btn-chat-sq btn-send-sq" id="btnSendMessage" title="Trimite mesaj">
                                <svg viewBox="0 0 24 24" class="send-svg-icon">
                                    <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                                </svg>
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Action Modal for Message Options (Long-Press / Click) -->
                <div id="messageActionModal" class="modal-overlay hidden" onclick="closeMessageModal(event)">
                    <div class="modal-sheet" onclick="event.stopPropagation()">
                        <div class="modal-header">
                            <span id="modalMsgTitle">Opțiuni Mesaj</span>
                            <button type="button" class="modal-close-btn" onclick="closeMessageModal()">✕</button>
                        </div>
                        <div class="modal-actions" id="modalActionsContainer">
                            <!-- Populat dinamic: Editare / Ștergere pentru toți / Ștergere pentru mine -->
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
        </footer>
    </div>

    <script src="app.js?v=5"></script>
</body>
</html>
